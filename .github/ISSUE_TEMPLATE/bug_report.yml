name: Bug report
description: Report a reproducible timeline defect.
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, fixture paths, expected behavior, and observed behavior.
    validations:
      required: true
  - type: textarea
    id: evidence-safety
    attributes:
      label: Evidence safety
      description: Confirm fixtures are synthetic or sanitized and no real artifacts are attached.
    validations:
      required: true
