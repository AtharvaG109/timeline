name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Race test
        run: make test-race
      - name: Build
        run: make build
      - name: Benchmarks
        run: make bench
      - name: Release snapshot
        run: make release-snapshot

  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: ".exe"
            archive: zip
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          mkdir -p "dist/timeline_${VERSION#v}_${GOOS}_${GOARCH}"
          go build -trimpath -ldflags="-s -w -X timeline/internal/version.Version=${VERSION#v} -X timeline/internal/version.Commit=${COMMIT} -X timeline/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o "dist/timeline_${VERSION#v}_${GOOS}_${GOARCH}/timeline${{ matrix.ext }}" ./cmd/timeline
          cp README.md SECURITY.md "dist/timeline_${VERSION#v}_${GOOS}_${GOARCH}/"
      - name: Checksum
        run: |
          set -eu
          cd dist
          name="timeline_${GITHUB_REF_NAME#v}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r "${name}.zip" "${name}"
            rm -rf "${name}"
          else
            tar -czf "${name}.tar.gz" "${name}"
            rm -rf "${name}"
          fi
          sha256sum "${name}".* > "${name}.sha256"
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: timeline-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        run: |
          cd dist
          cat *.sha256 > checksums.txt
      - name: Generate SBOM
        run: |
          go run ./scripts/sbom > dist/sbom-go-modules.json
          cd dist
          sha256sum sbom-go-modules.json > sbom-go-modules.json.sha256
          cat sbom-go-modules.json.sha256 >> checksums.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/sbom-go-modules.json
          generate_release_notes: true
